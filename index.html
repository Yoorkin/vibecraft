<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebCubes Mini MC</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
      }
      #hud button {
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.12);
        color: #eee;
        font-size: 11px;
        cursor: pointer;
      }
      #hud button.active {
        background: #7be07b;
        border-color: #a7f0a7;
        color: #111;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        z-index: 9;
        pointer-events: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
      }
      #crosshair::before {
        left: 6px;
        top: 0;
        width: 2px;
        height: 14px;
      }
      #crosshair::after {
        top: 6px;
        left: 0;
        width: 14px;
        height: 2px;
      }
      #hotbar {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
      }
      #hotbar .slot {
        min-width: 56px;
        padding: 6px 6px;
        text-align: center;
        font-size: 11px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      #hotbar .slot.active {
        background: rgba(255, 255, 255, 0.85);
        color: #111;
        border-color: rgba(255, 255, 255, 0.95);
      }
      #loading {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        letter-spacing: 0.3px;
      }
      #loading .panel {
        width: 260px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
      #loading .bar {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
      }
      #loading .bar-fill {
        width: 0%;
        height: 100%;
        background: #7be07b;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      Click to lock pointer<br />
      WASD move · Space jump · Shift sneak · Ctrl or double-tap W sprint<br />
      Left click break · Right click place<br />
      1-0 / - / = select block
      <br />
      <button id="fly-toggle" type="button" title="Esc to unlock cursor">
        Fly: Off
      </button>
    </div>
    <div id="crosshair"></div>
    <div id="loading">
      <div class="panel">
        <div class="loading-text">Loading 0%</div>
        <div class="bar"><div class="bar-fill"></div></div>
      </div>
    </div>
    <div id="hotbar">
      <div class="slot">1 Grass</div>
      <div class="slot">2 Dirt</div>
      <div class="slot">3 Stone</div>
      <div class="slot">4 Sand</div>
      <div class="slot">5 Wood</div>
      <div class="slot">6 Brick</div>
      <div class="slot">7 Planks</div>
      <div class="slot">8 Leaves</div>
      <div class="slot">9 Cobble</div>
      <div class="slot">0 Gravel</div>
      <div class="slot">- Clay</div>
      <div class="slot">= Snow</div>
    </div>
    <script src="_build/js/release/build/cmd/main/main.js"></script>
  </body>
</html>
